<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/industry-6b19fe34-368f-49a0-9508-8f86145dc3c5/styles.css">
  <script src="_ds/industry-6b19fe34-368f-49a0-9508-8f86145dc3c5/_ds_bundle.js"></script>
</helmet>
<div style="position:relative;width:100%;height:100%;min-height:640px;overflow:hidden">
  <dc-import name="MapView" layer="{{ layer }}" base="{{ base }}" water="{{ water }}" sensors="{{ sensors }}" labels="{{ labels }}" drawn="{{ drawn }}" opacity="{{ opacity }}" selected="{{ selId }}" on-cell="{{ onCell }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>

  <div class="blueprint" style="position:absolute;top:20px;left:20px;width:272px;background:color-mix(in srgb,var(--color-bg) 92%,transparent);backdrop-filter:blur(8px)">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--color-divider)"><dc-import name="Icon" n="layers" s="15" hint-size="15px,15px"></dc-import><span style="font-family:var(--font-heading);font-weight:600;font-size:16px">Layers</span><span style="margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--muted)">{{ site.name }}</span></div>
    <div style="padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--color-divider)">
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-bottom:2px">SURFACE LAYER</div>
      <sc-for list="{{ surf }}" as="o">
        <button onClick="{{ o.pick }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border:1px solid {{ o.bd }};background:{{ o.bg }};font-size:13px" style-hover="border-color:var(--divider-strong)">
          <span style="width:12px;height:12px;border:1px solid var(--divider-strong);display:grid;place-items:center"><span style="width:6px;height:6px;background:{{ o.dot }}"></span></span>
          <span style="flex:1">{{ o.label }}</span><span style="width:40px;height:6px;background:{{ o.ramp }}"></span>
        </button>
      </sc-for>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)"><span>OPACITY</span><input type="range" min="10" max="90" value="{{ opPct }}" onChange="{{ onOp }}" style="flex:1;accent-color:var(--color-accent)"><span style="width:30px;text-align:right;color:var(--color-text)">{{ opPct }}%</span></div>
    </div>
    <div style="padding:12px 14px;display:flex;flex-direction:column;gap:4px">
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--faint);margin-bottom:2px">OVERLAYS</div>
      <sc-for list="{{ overlays }}" as="o">
        <button onClick="{{ o.toggle }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;font-size:13px" style-hover="background:var(--color-neutral-100)">
          <span style="color:var(--muted);display:flex"><dc-import name="Icon" n="{{ o.icon }}" s="14" hint-size="14px,14px"></dc-import></span>
          <span style="flex:1">{{ o.label }}</span>
          <span style="width:28px;height:16px;border:1px solid {{ o.bd }};background:{{ o.bg }};position:relative;transition:background .15s"><span style="position:absolute;top:2px;left:{{ o.x }}px;width:10px;height:10px;background:{{ o.knob }};transition:left .15s"></span></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 92%,transparent);backdrop-filter:blur(8px)">
    <sc-for list="{{ tools }}" as="t">
      <button onClick="{{ t.pick }}" title="{{ t.label }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;font-size:12.5px;border-right:1px solid var(--color-divider);background:{{ t.bg }};color:{{ t.fg }}" style-hover="color:var(--color-text)"><dc-import name="Icon" n="{{ t.icon }}" s="15" hint-size="15px,15px"></dc-import>{{ t.label }}</button>
    </sc-for>
  </div>

  <div style="position:absolute;top:20px;right:{{ ctrlRight }}px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;transition:right .25s ease">
    <div style="display:flex;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 92%,transparent)">
      <button onClick="{{ setTopo }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;font-size:12.5px;background:{{ topoBg }};color:{{ topoFg }}"><dc-import name="Icon" n="mountain" s="14" hint-size="14px,14px"></dc-import>Topography</button>
      <button onClick="{{ setSat }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;font-size:12.5px;border-left:1px solid var(--color-divider);background:{{ satBg }};color:{{ satFg }}"><dc-import name="Icon" n="satellite" s="14" hint-size="14px,14px"></dc-import>Satellite</button>
    </div>
    <div style="display:flex;flex-direction:column;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 92%,transparent)">
      <button style="all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center" style-hover="background:var(--color-neutral-100)"><dc-import name="Icon" n="plus" s="15" hint-size="15px,15px"></dc-import></button>
      <button style="all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-top:1px solid var(--color-divider)" style-hover="background:var(--color-neutral-100)"><span style="width:12px;height:1.5px;background:currentColor"></span></button>
      <button style="all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-top:1px solid var(--color-divider)" style-hover="background:var(--color-neutral-100)"><dc-import name="Icon" n="crosshair" s="15" hint-size="15px,15px"></dc-import></button>
    </div>
  </div>

  <div style="position:absolute;left:20px;bottom:20px;display:flex;align-items:center;gap:14px;padding:8px 12px;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 92%,transparent);font-family:var(--font-mono);font-size:10.5px;color:var(--muted)">
    <sc-if value="{{ isRisk }}" hint-placeholder-val="{{ true }}"><span style="display:flex;align-items:center;gap:10px">RISK <span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;background:#38A88A"></span>&lt;25</span><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;background:#E7A83B"></span>25–50</span><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;background:#EE8434"></span>50–75</span><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;background:#D96565"></span>&gt;75</span></span></sc-if>
    <sc-if value="{{ isNdvi }}"><span style="display:flex;align-items:center;gap:8px">NDVI 0.1 <span style="width:120px;height:8px;background:linear-gradient(90deg,#9C7A45,#B8A04A,#7FB24E,#2E9B55)"></span> 0.6</span></sc-if>
    <span style="width:1px;height:14px;background:var(--color-divider)"></span><span>0 ─── 2 km</span><span>{{ cursor }}</span>
  </div>

  <div style="position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:420px;display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 92%,transparent)">
    <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--muted)">FORECAST</span>
    <input type="range" min="0" max="30" value="{{ day }}" onChange="{{ onDay }}" style="flex:1;accent-color:var(--color-accent)">
    <span style="font-family:var(--font-mono);font-size:11.5px;width:96px;text-align:right">{{ dayLabel }}</span>
  </div>

  <sc-if value="{{ drawer }}" hint-placeholder-val="{{ true }}">
    <aside style="position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--color-surface);border-left:1px solid var(--color-divider);display:flex;flex-direction:column;animation:apFade .2s ease">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--color-divider)">
        <div style="display:flex;flex-direction:column;gap:6px"><span style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted)">{{ dKicker }}</span><span style="font-family:var(--font-heading);font-weight:600;font-size:24px;line-height:1.05">{{ dTitle }}</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">{{ dCoord }}</span></div>
        <button onClick="{{ closeDrawer }}" style="all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--color-divider)" style-hover="border-color:var(--divider-strong)"><dc-import name="Icon" n="x" s="14" hint-size="14px,14px"></dc-import></button>
      </div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:20px;overflow-y:auto">
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--muted)">MEAN RISK</span><span style="font-family:var(--font-heading);font-weight:600;font-size:52px;line-height:1">{{ dScore }}</span></div>
          <dc-import name="RiskBadge" score="{{ dScore }}" show-score="{{ false }}" hint-size="80px,22px"></dc-import>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)">
          <sc-for list="{{ dStats }}" as="s">
            <div style="padding:10px 12px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:3px"><span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--muted)">{{ s.k }}</span><span style="font-family:var(--font-mono);font-size:15px">{{ s.v }}</span></div>
          </sc-for>
        </div>
        <sc-if value="{{ isArea }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--muted)">AREA BY RISK CLASS</span>
            <div style="display:flex;height:10px;gap:2px"><div style="flex:4.1;background:#38A88A"></div><div style="flex:11.8;background:#E7A83B"></div><div style="flex:17.3;background:#EE8434"></div><div style="flex:5.4;background:#D96565"></div></div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);font-family:var(--font-mono);font-size:11px"><span>4.1 km²</span><span>11.8</span><span>17.3</span><span>5.4</span></div>
          </div>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--muted)">RISK · LAST 60 DAYS</span>
          <svg viewBox="0 0 300 70" preserveAspectRatio="none" style="width:100%;height:70px;display:block;border-bottom:1px solid var(--color-divider)"><path d="M0 52 L30 50 L60 47 L90 44 L120 40 L150 38 L180 33 L210 30 L240 27 L270 24 L300 20" fill="none" stroke="#EE8434" stroke-width="1.5" vector-effect="non-scaling-stroke"></path><path d="M0 35H300" stroke="var(--muted)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"></path></svg>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" style="flex:1;height:34px;color:var(--color-text)"><dc-import name="Icon" n="download" s="14" hint-size="14px,14px"></dc-import>Export GeoJSON</button>
          <button class="btn btn-primary blueprint" style="flex:1;height:34px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Save as zone</button>
        </div>
      </div>
    </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state={layer:'risk',base:'topo',water:true,sensors:true,labels:true,op:45,tool:'draw',cell:null,drawn:true,drawer:true,day:0};
  renderVals(){
    const S=this.state, set=o=>()=>this.setState(o);
    const surf=[['risk','Drought risk','linear-gradient(90deg,#38A88A,#E7A83B,#EE8434,#D96565)'],['ndvi','NDVI','linear-gradient(90deg,#9C7A45,#B8A04A,#2E9B55)'],['none','None','transparent']].map(([id,label,ramp])=>{const on=S.layer===id;return{label,ramp,pick:set({layer:id}),bd:on?'color-mix(in srgb,var(--color-accent) 40%,transparent)':'transparent',bg:on?'var(--color-accent-100)':'transparent',dot:on?'var(--color-accent)':'transparent'};});
    const tg=(k,label,icon)=>{const on=S[k];return{label,icon,toggle:()=>this.setState({[k]:!on}),bd:on?'var(--color-accent)':'var(--divider-strong)',bg:on?'var(--color-accent-100)':'transparent',knob:on?'var(--color-accent)':'var(--muted)',x:on?14:2};};
    const tools=[['select','Select','crosshair'],['draw','Draw area','polygon'],['measure','Measure','ruler']].map(([id,label,icon])=>({label,icon,pick:()=>this.setState({tool:id,drawn:id==='draw'?true:S.drawn,drawer:id==='draw'?true:S.drawer,cell:id==='draw'?null:S.cell}),bg:S.tool===id?'var(--s3)':'transparent',fg:S.tool===id?'var(--color-text)':'var(--muted)'}));
    const c=S.cell, isArea=!c;
    const d=new Date(2026,8,23+S.day);
    return { site:this.props.site ?? {name:'Ichkeul'}, layer:S.layer, base:S.base, water:S.water, sensors:S.sensors, labels:S.labels, drawn:S.drawn, opacity:S.op/100, opPct:S.op, onOp:e=>this.setState({op:+e.target.value}),
      selId:c?c.id:null, onCell:cell=>this.setState({cell,drawer:true,tool:'select'}), surf,
      overlays:[tg('water','Water bodies','waves'),tg('sensors','Sensor stations','radio'),tg('labels','Place labels','pin')], tools,
      topoBg:S.base==='topo'?'var(--s3)':'transparent', topoFg:S.base==='topo'?'var(--color-text)':'var(--muted)', satBg:S.base==='sat'?'var(--s3)':'transparent', satFg:S.base==='sat'?'var(--color-text)':'var(--muted)', setTopo:set({base:'topo'}), setSat:set({base:'sat'}),
      isRisk:S.layer!=='ndvi', isNdvi:S.layer==='ndvi', cursor:c?`${c.lat}°N ${c.lon}°E`:'37.142°N 9.781°E',
      day:S.day, onDay:e=>this.setState({day:+e.target.value}), dayLabel:S.day?`+${S.day}d · ${d.getDate()} ${['Sep','Oct'][d.getMonth()-8]}`:'Today · 23 Sep',
      drawer:S.drawer, ctrlRight:S.drawer?380:20, closeDrawer:set({drawer:false,cell:null}), isArea,
      dKicker:isArea?'DRAWN AREA · POLYGON':'GRID CELL · 1 KM²', dTitle:isArea?'Mateur plain, north':`Cell ${c.id}`, dCoord:isArea?'5 vertices · centroid 37.118°N 9.822°E':`${c.lat}°N ${c.lon}°E`,
      dScore:isArea?61:c.score,
      dStats:isArea?[{k:'AREA',v:'38.6 km²'},{k:'PERIMETER',v:'25.1 km'},{k:'NDVI MEAN',v:'0.27'},{k:'SOIL MOIST.',v:'12.8 %'},{k:'SPEI-3',v:'−1.71'},{k:'LST',v:'35.2 °C'}]
        :[{k:'NDVI',v:c.ndvi.toFixed(2)},{k:'SOIL MOIST.',v:(22-c.score/6).toFixed(1)+' %'},{k:'SPEI-3',v:(-c.score/38).toFixed(2)},{k:'LST',v:(29+c.score/12).toFixed(1)+' °C'},{k:'LAND USE',v:c.score>55?'Cereal':'Pasture'},{k:'ELEVATION',v:(18+c.score%40)+' m'}] };
  }
}
</script>
</body>
</html>
